name: Release Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            asset_name: cc-switch-windows-x86_64
            sidecar_target: x86_64-pc-windows-msvc
            tauri_target: x86_64-pc-windows-msvc
            bundles: msi
          - name: Windows ARM64
            os: windows-11-arm
            arch: arm64
            asset_name: cc-switch-windows-arm64
            sidecar_target: aarch64-pc-windows-msvc
            tauri_target: aarch64-pc-windows-msvc
            bundles: msi
            rust_target: aarch64-pc-windows-msvc
          - name: Linux x86_64
            os: ubuntu-22.04
            asset_name: cc-switch-linux-x86_64
            sidecar_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            asset_name: cc-switch-linux-arm64
            sidecar_target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: macOS Universal
            os: macos-14
            asset_name: cc-switch-macos-universal
            sidecar_target: universal-apple-darwin
            tauri_target: universal-apple-darwin
            bundles: app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sidecars/cursor-byok/go.mod
          cache-dependency-path: sidecars/cursor-byok/go.sum

      - name: Setup protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protobuf Go plugins
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: Build and test Cursor sidecar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-cursor-sidecar.mjs ${{ matrix.sidecar_target }} --test

      - name: Verify macOS sidecar inputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            test -x "src-tauri/binaries/cursor-sidecar-$target"
          done
          lipo src-tauri/binaries/cursor-sidecar-universal-apple-darwin \
            -verify_arch arm64 x86_64

      - name: Add Rust target
        if: matrix.rust_target != ''
        shell: bash
        run: rustup target add ${{ matrix.rust_target }}

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack prepare pnpm@10.12.3 --activate
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure VBScript for WiX validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online |
            Where-Object Name -Like 'VBSCRIPT*' |
            Select-Object -First 1
          if ($null -ne $capability -and $capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name
          }

      - name: Build unsigned test packages
        shell: bash
        run: |
          set -euo pipefail
          command=(pnpm tauri build --verbose --bundles "${{ matrix.bundles }}" --config '{"bundle":{"createUpdaterArtifacts":false}}')
          if [ -n "${{ matrix.tauri_target }}" ]; then
            command+=(--target "${{ matrix.tauri_target }}")
          fi
          "${command[@]}"

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-test-assets
          find src-tauri/target -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o \
            -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o \
            -name '*.tar.gz' \) -print -exec cp {} release-test-assets/ \;
          find src-tauri/target -type d -name '*.app' -print -exec ditto -c -k --sequesterRsrc --keepParent {} release-test-assets/ \; 2>/dev/null || true
          test -n "$(find release-test-assets -mindepth 1 -maxdepth 1 -type f -print -quit)"
          ls -lh release-test-assets

      - name: Prefix release asset names
        shell: bash
        run: |
          set -euo pipefail
          for path in release-test-assets/*; do
            filename=$(basename "$path")
            mv "$path" "release-test-assets/${{ matrix.asset_name }}-$filename"
          done

      - name: Upload test packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: release-test-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish rolling main preview
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download test packages
        uses: actions/download-artifact@v8
        with:
          pattern: cc-switch-*
          path: release-test-assets
          merge-multiple: true

      - name: Verify downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-test-assets -mindepth 1 -maxdepth 1 -type f -print -quit)"
          ls -lh release-test-assets

      - name: Update rolling preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: main-preview
        run: |
          set -euo pipefail

          tag_ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/${PREVIEW_TAG}"
          if gh api "${tag_ref}" >/dev/null 2>&1; then
            gh api --method PATCH "${tag_ref}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${PREVIEW_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          if ! gh release view "${PREVIEW_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${PREVIEW_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "CC Switch Main Preview" \
              --prerelease \
              --notes "Rolling unsigned preview packages built from the latest main branch."
          fi

          gh release upload "${PREVIEW_TAG}" release-test-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          find release-test-assets -mindepth 1 -maxdepth 1 -type f \
            -exec basename {} \; | sort > current-assets.txt
          gh release view "${PREVIEW_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | sort > published-assets.txt
          comm -23 published-assets.txt current-assets.txt | while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            gh release delete-asset "${PREVIEW_TAG}" "${asset_name}" \
              --repo "${GITHUB_REPOSITORY}" --yes
          done

          gh release edit "${PREVIEW_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CC Switch Main Preview" \
            --prerelease \
            --notes "Rolling unsigned preview packages built from main commit ${GITHUB_SHA}. These packages are for testing only."
